[project]
name = "complex-diffusion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.4",
  "transformers>=4.44",
  "datasets>=2.20",
]

[dependency-groups]
dev = ["pytest>=8", "black", "ruff"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["src"]
